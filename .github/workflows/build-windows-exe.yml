name: Build Crocrodile UCI Windows .exe
on:
  push:
    paths:
      - "crocrodile_uci.py"
      - "Crocrodile.spec"
      - "requirements-uci.txt"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Install deps + PyInstaller (+UPX)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-uci.txt
          python -m pip install pyinstaller
          choco install upx -y --no-progress || echo "UPX opcional, sigo sin el"
      - name: Build onefile exe
        run: pyinstaller --noconfirm --clean Crocrodile.spec
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: Crocrodile-UCI-Windows-exe
          path: dist/Crocrodile-UCI-Windows.exe
          if-no-files-found: error
